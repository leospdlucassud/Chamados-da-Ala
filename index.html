<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8B6B3D">
<title>Magnifique seu Chamado</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="app">
  <header>
    <div class="h-row">
      <button class="btn-back" id="btnBack" aria-label="Voltar"><span class="bk-ico">‹</span><span class="bk-txt">Voltar</span></button>
      <div class="h-title" id="hTitle">
        <div class="t">Magnifique seu Chamado</div>
        <div class="s">Guia de chamados da Ala</div>
      </div>
      <div class="h-tools">
        <button class="tbtn" id="fMinus" aria-label="Diminuir fonte">A−</button>
        <button class="tbtn" id="fPlus" aria-label="Aumentar fonte">A+</button>
        <button class="tbtn" id="themeBtn" aria-label="Alternar tema">☾</button>
      </div>
    </div>
    <input class="search" id="search" type="search" placeholder="Buscar chamado em todas as organizações…" autocomplete="off">
  </header>

  <main id="view"></main>

  <footer id="footer"></footer>
</div>

<script src="js/dados/_builders.js"></script>
<script src="js/dados/bispado.js"></script>
<script src="js/dados/quorum-elderes.js"></script>
<script src="js/dados/sociedade-socorro.js"></script>
<script src="js/dados/sacerdocio-aaronico.js"></script>
<script src="js/dados/mocas.js"></script>
<script src="js/dados/escola-dominical.js"></script>
<script src="js/dados/primaria.js"></script>
<script src="js/dados/missionarios.js"></script>
<script src="js/dados/templo-historia.js"></script>
<script src="js/dados/jas.js"></script>
<script src="js/dados/outros.js"></script>
<script src="js/dados/_registro.js"></script>
<script src="js/app.js"></script>
</body>
</html>
